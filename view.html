<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>BM 분석</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
/* 레이아웃: 상단 종목 개요표 → 선택 종목 상세(재무 차트 → 사업/BM 원문 발췌 → 변화·공시). 숫자는 DART 공시값과 코드 계산값 */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --ink: #14202b; --muted: #5a6b79; --line: #dce3e9;
  --accent: #0b6e8a; --accent-soft: #e2f1f5; --bar1: #9db3c4; --bar2: #2a78d6; --bar3: #eb6834; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --pos: #1a7f4b; --neg: #c0392b; --warn: #9a6a0a;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1419; --surface: #141d25; --ink: #e5ecf1; --muted: #8b9eae; --line: #25333e;
    --accent: #4cb6d3; --accent-soft: #14303a; --bar1: #5f7a8f; --bar2: #3987e5; --bar3: #d95926; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --pos: #4cc38a; --neg: #ff7b6b; --warn: #e0b04a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1419; --surface: #141d25; --ink: #e5ecf1; --muted: #8b9eae; --line: #25333e;
  --accent: #4cb6d3; --accent-soft: #14303a; --bar1: #5f7a8f; --bar2: #3987e5; --bar3: #d95926; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --pos: #4cc38a; --neg: #ff7b6b; --warn: #e0b04a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55;
  padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
button, .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); color: var(--accent); }
button:focus-visible, a:focus-visible, tr[tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
h3 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--muted); letter-spacing: 0.02em; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--accent-soft); }
tr.row.on td { background: var(--accent-soft); }
.code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; font-family: var(--mono); }
.head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.head .nm { font-size: 20px; font-weight: 600; }
.oneline { margin: 8px 0 0; max-width: 110ch; color: var(--ink); line-height: 1.7; } .overview p { margin: 8px 0 0; max-width: 110ch; line-height: 1.75; }
.meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 22px 18px; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--muted); font-family: var(--mono); font-size: 11.5px; }
svg .vt { fill: var(--ink); }
svg .ax { stroke: var(--line); stroke-width: 1; }
svg .b1 { fill: var(--bar1); } svg .b2 { fill: var(--bar2); } svg .b3 { fill: var(--bar3); } svg .bn { fill: var(--neg); } svg .dim { opacity: .62; }
svg .gp { fill: var(--pos); } svg .gn { fill: var(--neg); } svg text.sm { font-size: 9.5px; }
figure.chart { margin: 0; min-width: 0; } figure.chart figcaption { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 4px; } figure.chart figcaption span { font-size: 12px; color: var(--muted); }
.leg i.b1 { background: var(--bar1); } .leg i.b2 { background: var(--bar2); } .leg i.b3 { background: var(--bar3); }
details.card > summary { cursor: pointer; font-size: 15px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; } details.card > summary::after { content: '펼치기'; font-size: 12px; font-weight: 400; color: var(--muted); } details[open].card > summary::after { content: '접기'; } details.card[open] > summary { margin-bottom: 10px; }
svg .ln { stroke: var(--accent); stroke-width: 2; fill: none; } svg .pt { fill: var(--accent); }
.leg { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.leg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.md p { margin: 4px 0; max-width: 90ch; } .md p.cap { color: var(--muted); font-size: 12.5px; }
.md ul { margin: 4px 0 4px 18px; padding: 0; max-width: 90ch; } .md li { margin: 3px 0; }
.md .scroll { margin: 6px 0 10px; border: 1px solid var(--line); border-radius: 6px; }
.md table { font-size: 12.5px; min-width: 620px; } .md td, .md th { min-width: 56px; }
.md thead th { background: var(--accent-soft); color: var(--ink); }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }
.notes ul { margin: 4px 0 8px 18px; padding: 0; max-width: 90ch; } .notes li { margin: 4px 0; }
.note { font-size: 12px; color: var(--warn); }
.sec-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.sec .q, .glance .q { font-size: 12px; color: var(--muted); letter-spacing: .02em; margin-bottom: 4px; }
h2.vd { font-size: 16.5px; line-height: 1.45; margin: 0 0 12px; max-width: 70ch; text-wrap: balance; }
h2.vd b { color: var(--accent); font-weight: 600; }
.tx { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--line); } .tx h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); } .tx p { margin: 0 0 8px; max-width: 110ch; line-height: 1.7; } .tx b, .glance b, .notes b { background: var(--accent-soft); padding: 0 2px; font-weight: 600; }
.glance ul { margin: 0 0 8px 18px; padding: 0; max-width: 78ch; } .glance li { margin: 5px 0; }
.glance { border-color: var(--accent); }
.sec .kpis { margin-bottom: 4px; }
.card .charts .scroll { margin-top: 4px; }
@media (max-width: 520px) { h1 { font-size: 19px; } .kpi .v { font-size: 17px; } }

  .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
  ul.flow { margin: 0; padding-left: 18px; max-width: 110ch; line-height: 1.75; } ul.flow li { margin: 3px 0; }
  details.rep { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; min-width: 0; } details.rep.old { opacity: .8; }
  details.rep > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; list-style: none; }
  details.rep .rd { font-family: var(--mono); font-size: 12px; color: var(--muted); } details.rep .rb { font-weight: 600; } details.rep .rt { flex: 1 1 200px; min-width: 0; }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); } .tag.pos { color: var(--s3); } .tag.mid { color: var(--s1); }
  .rmeta { font-size: 12.5px; color: var(--muted); margin: 8px 0 4px; } .rvs { margin: 6px 0; max-width: 110ch; } ul.rpts { margin: 6px 0; padding-left: 18px; max-width: 110ch; line-height: 1.7; } ul.rpts li { margin: 5px 0; }
  table.est td { padding: 4px 9px; } .watch { margin: 8px 0 2px; padding: 8px 10px; border-left: 3px solid var(--s1); background: var(--bg); max-width: 110ch; line-height: 1.65; font-size: 13px; }
  #pickw { position: relative; min-width: 0; } #pick { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 220px; max-width: 100%; box-sizing: border-box; }
  #pl { position: absolute; right: 0; } @media (max-width: 640px) { #pl { right: auto; left: 0; } } #pl { top: calc(100% + 4px); z-index: 20; width: 280px; max-width: calc(100vw - 32px); max-height: 320px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  #pl button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 10px 12px; background: transparent; } #pl button:last-child { border-bottom: 0; } #pl button.on { background: var(--accent-soft); } #pl .c { color: var(--muted); font-family: var(--mono); font-size: 12px; } #pl .none { padding: 10px 12px; color: var(--muted); }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div>
      <h1>BM 분석</h1>
      <div class="sub" id="sub">불러오는 중</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div id="pickw" hidden><input id="pick" type="search" placeholder="종목명·코드 검색" autocomplete="off" aria-label="종목 검색"><div id="pl" hidden></div></div>
      <a href="index.html" class="btn" style="align-self:center">목록</a><button id="btn-gpt" hidden>GPT용 복사</button><button id="btn-save" hidden>HTML로 저장</button>
    </div>
  </header>
  <div id="detail"><div class="card empty">불러오는 중</div></div>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var cur = null;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function eok(v) { return v == null ? "–" : Math.round(v / 1e8).toLocaleString("ko-KR"); }
  function pct(v, d) { return v == null || !isFinite(v) ? "–" : (v).toFixed(d == null ? 1 : d) + "%"; }
  function sgn(v) { return v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + v.toFixed(1) + "%"; }
  function cls(v) { return v == null ? "" : v > 0 ? "pos" : v < 0 ? "neg" : ""; }
  function div(a, b) { return a == null || b == null || b === 0 ? null : a / b * 100; }
  function yoy(a, b) { return a == null || b == null || b === 0 ? null : (a - b) / Math.abs(b) * 100; }
  function fdate(s) { return s && s.length === 8 ? s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6) : (s || ""); }
  function last(a) { return a && a.length ? a[a.length - 1] : null; }

  // ------- 마크다운(DART 표 원문) 렌더러
  function md(text) {
    if (!text) return '<div class="empty">not_found</div>';
    var lines = text.split("\n"), out = [], tbl = [], ul = [];
    function flushT() {
      if (!tbl.length) return;
      var rows = tbl.map(function (r) { return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); });
      rows = rows.filter(function (r) { return !r.every(function (c) { return /^:?-+:?$/.test(c); }); });
      var h = "<div class='scroll'><table>";
      if (rows.length > 1) h += "<thead><tr>" + rows[0].map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead>";
      h += "<tbody>" + rows.slice(rows.length > 1 ? 1 : 0).map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table></div>";
      out.push(h); tbl = [];
    }
    function flushU() { if (ul.length) { out.push("<ul>" + ul.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>"); ul = []; } }
    lines.forEach(function (l) {
      if (l.indexOf("|") === 0) { flushU(); tbl.push(l); return; }
      flushT();
      if (/^- /.test(l)) { ul.push(l.slice(2)); return; }
      flushU();
      if (!l.trim()) return;
      if (/^\*.*\*$/.test(l.trim())) out.push("<p class='cap'>" + esc(l.trim().replace(/^\*|\*$/g, "")) + "</p>");
      else if (/^\[.*\]/.test(l.trim())) out.push("<h3>" + esc(l.trim()) + "</h3>");
      else out.push("<p>" + esc(l) + "</p>");
    });
    flushT(); flushU();
    return "<div class='md'>" + out.join("") + "</div>";
  }

  // ------- 차트(SVG): 한 차트에 한 계열, 값 라벨은 막대 위, 전년 동기 대비는 라벨 아래
  var W = 480, H = 230, L = 44, R = 8, T = 22, B = 40;
  function fmtN(v, u) { return u === "%" ? v.toFixed(1) + "%" : (u === "원" || u === "주" || u === "백만") ? Math.round(v).toLocaleString("ko-KR") : Math.round(v / 1e8).toLocaleString("ko-KR"); }
  function frame(vals, u, zero) {
    var mx = Math.max.apply(null, vals), mn = zero ? Math.min(0, Math.min.apply(null, vals)) : Math.min.apply(null, vals);
    if (u === "%") { mx = Math.max(mx, 0); mn = Math.min(mn, 0); }
    if (mx === mn) mx = mn + 1;
    var pad = (mx - mn) * 0.08; if (mx > 0) mx += pad; if (mn < 0) mn -= pad;
    return { mx: mx, mn: mn, ph: H - T - B, pw: W - L - R };
  }
  function grid(f, u) {
    var s = "";
    for (var i = 0; i <= 3; i++) {
      var gv = f.mn + (f.mx - f.mn) * i / 3, gy = T + f.ph - (gv - f.mn) / (f.mx - f.mn) * f.ph;
      s += "<line class='ax' x1='" + L + "' x2='" + (W - R) + "' y1='" + gy + "' y2='" + gy + "'/><text x='" + (L - 5) + "' y='" + (gy + 3.5) + "' text-anchor='end'>" + (u === "%" ? gv.toFixed(0) + "%" : u === "주" ? (Math.abs(gv) >= 1e3 ? (gv / 1e4).toFixed(1) + "만" : Math.round(gv).toLocaleString("ko-KR")) : (u === "원" || u === "백만") ? Math.round(gv).toLocaleString("ko-KR") : Math.round(gv / 1e8).toLocaleString("ko-KR")) + "</text>";
    }
    return s;
  }
  function chartBox(title, sub, inner, aria) {
    return "<figure class='chart'><figcaption><b>" + esc(title) + "</b><span>" + esc(sub) + "</span></figcaption><svg viewBox='0 0 " + W + " " + H + "' role='img' aria-label='" + esc(aria) + "'>" + inner + "</svg></figure>";
  }
  // 막대(단일 계열). yoyBase=true 이면 4칸 앞(전년 동기) 대비 증감률 표시
  function barOne(title, sub, labels, vals, u, yoyBase, pre) {
    var ok = vals.filter(function (v) { return v != null; });
    if (!ok.length) return chartBox(title, sub, "<text x='20' y='60'>데이터 없음</text>", title);
    var f = frame(ok, u, true), n = labels.length, slot = f.pw / n, bw = Math.min(30, slot * 0.6);
    function y(v) { return T + f.ph - (v - f.mn) / (f.mx - f.mn) * f.ph; }
    var s = grid(f, u), y0 = y(0);
    labels.forEach(function (lb, k) {
      var cx = L + slot * k + slot / 2, v = vals[k];
      if ((n - 1 - k) % (n > 10 ? 2 : 1) === 0) s += "<text x='" + cx + "' y='" + (H - 22) + "' text-anchor='middle'>" + esc(lb) + "</text>";
      if (v == null) return;
      var y1 = y(v), top = Math.min(y0, y1), h = Math.max(1.5, Math.abs(y0 - y1));
      s += "<rect class='" + (v < 0 ? "bn" : "b2") + (k === n - 1 ? "" : " dim") + "' x='" + (cx - bw / 2) + "' y='" + top + "' width='" + bw + "' height='" + h + "' rx='2'><title>" + esc(lb + " " + fmtN(v, u) + (u === "%" ? "" : (u === "원" || u === "주") ? u : u === "백만" ? "" : "억")) + "</title></rect>";
      if (v !== 0 && (n <= 8 || k === n - 1)) s += "<text class='vt' x='" + cx + "' y='" + (v >= 0 ? top - 4 : top + h + 11) + "' text-anchor='middle'>" + fmtN(v, u) + "</text>";
      var bv = k >= 4 ? vals[k - 4] : (pre && pre[k] != null ? pre[k] : null);
      if (yoyBase && bv != null && bv !== 0) {
        var yt, yc;
        if (bv > 0) {
          var g = (v - bv) / bv * 100; yc = g >= 0 ? "gp" : "gn";
          yt = Math.abs(g) > 999 ? (v > 0 ? "×" + Math.round(v / bv) : "적전") : (g > 0 ? "+" : "") + Math.round(g) + "%";
          if (v < 0) yt = "적전";
        } else { yc = v > 0 ? "gp" : "gn"; yt = v > 0 ? "흑전" : "적자↓"; }
        if (n <= 13) s += "<text class='" + yc + " sm' x='" + cx + "' y='" + (v >= 0 ? top - (n <= 8 || k === n - 1 ? 16 : 4) : y0 - 6) + "' text-anchor='middle'>" + yt + "</text>";
        else if ((n - 1 - k) % 2 === 0) s += "<text class='" + yc + (n >= 12 ? " sm" : "") + "' x='" + cx + "' y='" + (H - 8) + "' text-anchor='middle'>" + (n >= 12 && k !== n - 1 && /%$/.test(yt) ? yt.slice(0, -1) : yt) + "</text>";
      }
    });
    return chartBox(title, sub, s, title + " 분기 추이");
  }
  function lineOne(title, sub, labels, vals) {
    var ok = vals.filter(function (v) { return v != null; });
    if (!ok.length) return chartBox(title, sub, "<text x='20' y='60'>데이터 없음</text>", title);
    var f = frame(ok, "%", true), n = labels.length, slot = f.pw / n;
    function y(v) { return T + f.ph - (v - f.mn) / (f.mx - f.mn) * f.ph; }
    var s = grid(f, "%"), d = "", pts = "";
    labels.forEach(function (lb, k) {
      var cx = L + slot * k + slot / 2;
      s += "<text x='" + cx + "' y='" + (H - 22) + "' text-anchor='middle'>" + esc(lb) + "</text>";
      if (vals[k] == null) return;
      d += (d ? "L" : "M") + cx + "," + y(vals[k]);
      pts += "<circle class='pt' cx='" + cx + "' cy='" + y(vals[k]) + "' r='3.5'><title>" + esc(lb + " " + vals[k].toFixed(1) + "%") + "</title></circle><text class='vt' x='" + cx + "' y='" + (y(vals[k]) - 8) + "' text-anchor='middle'>" + vals[k].toFixed(1) + "</text>";
    });
    return chartBox(title, sub, s + "<path class='ln' d='" + d + "'/>" + pts, title + " 분기 추이");
  }
  // 연도 그룹 막대(계열 2~3개)
  function groupBars(title, sub, groups, series) {
    var all = []; series.forEach(function (sr) { sr.v.forEach(function (v) { if (v != null) all.push(v); }); });
    if (!all.length) return chartBox(title, sub, "<text x='20' y='60'>데이터 없음</text>", title);
    var f = frame(all, "억", true), n = groups.length, slot = f.pw / n, k = series.length, bw = Math.min(30, slot / (k + 1));
    function y(v) { return T + f.ph - (v - f.mn) / (f.mx - f.mn) * f.ph; }
    var s = grid(f, "억"), y0 = y(0);
    groups.forEach(function (g, gi) {
      var cx = L + slot * gi + slot / 2;

      : esc(rec.length) + "건의 최근 리포트, 투자의견·목표가를 제시한 곳은 없음(전부 NR)";
    var h = "<section class='card sec' id='research'><div class='q'>증권사 리포트 상세 (비공개 화면)</div><h2 class='vd'>" + hd + "</h2>";
    h += "<div class='kpis'>" + stat("최근 리포트", esc(last.broker), esc(last.date)) + stat("최근 목표가", won(last.tp), last.tp && last.price ? "작성일 주가 대비 " + sgn((last.tp / last.price - 1) * 100) : "") + (tps.length ? stat("최저·최고 목표가", Math.round(Math.min.apply(null, tps.map(function (r) { return r.tp; })) / 1000) + "천 ~ " + Math.round(Math.max.apply(null, tps.map(function (r) { return r.tp; })) / 1000) + "천", "최근 1년 내 리포트") : stat("투자의견 제시", "0건", rec.length + "건 모두 NR")) + "</div>";
    h += "<div class='cols2'>" + researchChart(R) + opChart(R) + "</div>";
    h += "<h3>톤 변화 흐름</h3><ul class='flow'>" + (R.tone_flow || []).map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
    h += "<h3>한눈에 비교</h3><div class='scroll'><table><thead><tr><th>날짜</th><th>증권사</th><th>의견</th><th class='n'>목표가</th><th class='n'>작성일 주가</th><th>톤</th></tr></thead><tbody>" + rp.map(function (r) { return "<tr" + (r.old ? " class='old'" : "") + "><td>" + esc(r.date) + "</td><td>" + esc(r.broker) + "</td><td>" + esc(r.opinion) + "</td><td class='n'>" + won(r.tp) + "</td><td class='n'>" + won(r.price) + "</td><td>" + esc(r.tone) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    if (R.forecast_check && R.forecast_check.length) h += "<h3>전망 vs 실제 (매출·영업이익, 억원)</h3><div class='scroll'><table><thead><tr><th>연도</th><th>출처</th><th class='n'>매출</th><th class='n'>영업이익</th><th class='n'>영업이익률</th></tr></thead><tbody>" + R.forecast_check.map(function (f) { return "<tr" + (f.act ? " style='font-weight:600'" : "") + "><td>" + esc(f.y) + "</td><td>" + esc(f.src) + "</td><td class='n'>" + f.rev.toLocaleString("ko-KR") + "</td><td class='n'>" + f.op.toLocaleString("ko-KR") + "</td><td class='n'>" + (f.op / f.rev * 100).toFixed(1) + "%</td></tr>"; }).join("") + "</tbody></table></div>";
    h += "<h3>리포트별 상세</h3>";
    rp.forEach(function (r, i) {
      h += "<details class='rep" + (r.old ? " old" : "") + "'" + (i === 0 ? " open" : "") + "><summary><span class='rd'>" + esc(r.date) + "</span><span class='rb'>" + esc(r.broker) + "</span><span class='rt'>" + esc(r.title) + "</span><span class='tag " + (r.tone_c || "") + "'>" + esc(r.tone) + "</span></summary>";
      h += "<div class='rmeta'>" + esc(r.opinion) + " · 목표가 " + won(r.tp) + " · 작성일 주가 " + won(r.price) + (r.tp && r.price ? " · 괴리 " + sgn((r.tp / r.price - 1) * 100) : "") + (r.analyst ? " · " + esc(r.analyst) : "") + "</div>";
      h += "<p class='rvs'><b>직전 대비</b> " + rich(r.vs) + "</p><ul class='rpts'>" + r.points.map(function (t) { return "<li>" + rich(t) + "</li>"; }).join("") + "</ul>";
      if (r.est && r.est.length) h += "<div class='scroll'><table class='est'><tbody>" + r.est.map(function (e) { return "<tr><td>" + esc(e.k) + "</td><td class='n'>" + esc(e.v) + "</td></tr>"; }).join("") + "</tbody></table></div>";
      if (r.watch) h += "<p class='watch'>" + rich(r.watch) + "</p>";
      h += "</details>";
    });
    return h + "<div class='meta'>" + esc(R.caveat || "") + " " + esc(R.note || "") + " 갱신 " + esc(R.updated || "") + "</div></section>";
  }
  function sum4(a, i) { var w = a.slice(Math.max(0, i - 3), i + 1); return w.length === 4 && w.every(ok) ? w.reduce(function (x, y) { return x + y; }, 0) : null; }

  // ------- 화면 갱신: 가장 최근 분석 1종목만 표시(새 분석이 이전 분석을 대체)
  function render() {
    var s = cur;
    $("#sub").textContent = s ? "최근 분석 · " + s.name + " (" + s.code + ") · 수집 " + String(s.generated_at || "").slice(0, 10) + " · 숫자는 공시값과 코드 계산값" : "DART 공시 기반";
    $("#detail").innerHTML = s ? renderDetail(s) : "<div class='card empty'>아직 분석 결과가 없습니다. 종목을 분석하면 이 화면이 그 결과로 바뀝니다.</div>";
    $("#btn-save").hidden = !(s && window.__dl);
  }

  // ------- 저장본(HTML) 생성: 스크립트 없이 열리는 정적 문서
  function staticHtml() {
    var css = $("#css").textContent;
    var body = "<div class='wrap'><header class='top'><div><h1>BM 대시보드</h1><div class='sub'>" + esc(cur.name) + " (" + cur.code + ") · 저장 " + new Date().toISOString().slice(0, 10) + "</div></div></header>" + renderDetail(cur).replace(/<details class='card'>/g, "<details class='card' open>") + "</div>";
    return "<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>" + esc(cur.name) + " BM 분석 (저장본)</title><style>" + css + "</style></head><body>" + body + "</body></html>";
  }
  $("#btn-save").onclick = function () {
    if (!window.__dl || !cur) return;
    window.__dl.save({ filename: cur.name + "_" + cur.code + "_BM_" + new Date().toISOString().slice(0, 10) + ".html", data: staticHtml() })
      .catch(function () { /* 거절·미지원은 조용히 무시 */ });
  };

  // ------- Pages: dash.json 을 fetch 로 읽음
  window.__dl = { save: function (o) { return new Promise(function (ok) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([o.data], { type: "text/html" }));
    a.download = o.filename; document.body.appendChild(a); a.click(); a.remove(); ok(); }); } };
  var code = new URLSearchParams(location.search).get("c");
  $("#btn-gpt").onclick = function () {
    if (!code) return;
    fetch("out/" + code + "/gpt_paste.md").then(function (r) { return r.text(); }).then(function (t) {
      return navigator.clipboard.writeText(t).then(function () { $("#btn-gpt").textContent = "복사됨 (" + t.length.toLocaleString() + "자)"; });
    }).catch(function () { $("#btn-gpt").textContent = "복사 실패 - 목록에서 gpt_paste 열기"; });
  };
  if (!code) { $("#detail").innerHTML = "<div class='card empty'>종목을 선택하세요. <a href='index.html'>목록</a></div>"; }
  else fetch("out/" + code + "/dash.json").then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (d) { cur = d; render(); $("#btn-gpt").hidden = false; })
    .catch(function () { $("#detail").innerHTML = "<div class='card empty'>데이터를 읽지 못했습니다.</div>"; });
})();
</script>
</body></html>
