name: analyze

on:
  workflow_dispatch:
    inputs:
      query:
        description: "종목코드 6자리(권장) 또는 기업명. 예: 028670"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: DART 수집 및 bm_card 생성
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: python dart_bm.py "$QUERY"

      - name: 결과 커밋
        env:
          QUERY: ${{ inputs.query }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git diff --cached --quiet || git commit -m "bm_card: $QUERY"
          git push
