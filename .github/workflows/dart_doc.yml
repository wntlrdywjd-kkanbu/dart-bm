name: dart_doc
on:
  workflow_dispatch:
    inputs:
      code:
        description: "종목코드"
        required: true
      rcepts:
        description: "접수번호(공백 구분)"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 원문 전체 저장
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          CODE: ${{ inputs.code }}
          RCEPTS: ${{ inputs.rcepts }}
        run: python tools/dump_doc.py "$CODE" $RCEPTS
      - name: 커밋
        env:
          CODE: ${{ inputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/$CODE/docs
          git diff --cached --quiet || git commit -m "docs: $CODE"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push && break; sleep $((i*4)); done
