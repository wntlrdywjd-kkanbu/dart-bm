name: prospectus

on:
  workflow_dispatch:
    inputs:
      query:
        description: "신규상장 종목명 또는 종목코드. 예: 동원파츠"
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 발행공시·정기보고서 원문 저장
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          QUERY: ${{ inputs.query }}
        run: python tools/prospectus_fetch.py "$QUERY" 2>&1 | tee out/last_prospectus.log; exit ${PIPESTATUS[0]}
      - name: 결과 커밋
        if: always()
        env:
          QUERY: ${{ inputs.query }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          git diff --cached --quiet || git commit -m "prospectus: $QUERY"
          for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push && break; sleep $((i*4)); done
