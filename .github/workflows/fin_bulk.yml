name: fin_bulk

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill(전체 재구성, 약 1,000호출) / update(작년~올해만 재조회·병합, 약 200호출)"
        required: true
        default: "backfill"
        type: choice
        options: [backfill, update]
      from_year:
        description: "backfill 시작 사업연도"
        required: false
        default: "2019"
      max_calls:
        description: "이번 실행 DART 호출 상한(일일 한도 20,000 안쪽)"
        required: false
        default: "3000"

permissions:
  contents: write

concurrency:
  group: fin-bulk
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: DART 분기 실적 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MODE: ${{ inputs.mode }}
          MAXC: ${{ inputs.max_calls }}
          FROM: ${{ inputs.from_year }}
        run: |
          mkdir -p fin_q
          python fin_bulk.py "$MODE" --max-calls "${MAXC:-3000}" --from-year "${FROM:-2019}" 2>&1 | tee fin_q/last_run.log
          exit ${PIPESTATUS[0]}

      - name: 결과 백업(커밋 실패에 대비)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fin_q-${{ github.run_id }}
          path: fin_q
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fin_q
          git diff --cached --quiet && exit 0
          git commit -m "fin_bulk: ${{ inputs.mode }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
